
services:
  db:
    image: mysql:8.0
    container_name: metro-db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: metrodb
    volumes:
      - metro-data:/var/lib/mysql

  app:
    image: tomcat:9.0
    container_name: metro-app
    ports:
      - "8080:8080"
    volumes:
      - ./target/metro-reservation-1.0.war:/usr/local/tomcat/webapps/metro-reservation.war
    depends_on:
      - db

volumes:
  metro-data:
